@if (carregando()) {
    <div class="absolute top-0 left-0 right-0 w-full z-50 h-1 pointer-events-none">
        <mat-progress-bar mode="indeterminate" class="w-full"></mat-progress-bar>
    </div>
}
<div class="grid grid-cols-1 md:grid-cols-2 min-h-screen bg-slate-50 relative">
    <div class="hidden md:flex flex-col items-center justify-center p-12 text-white bg-cor-padrao">
        <div class="text-center max-w-md">
            <mat-icon style="transform: scale(3.5); height: 48px; width: 48px; line-height: 48px;" class="mb-10 block mx-auto">storage</mat-icon>
            <h1 class="text-5xl font-bold mb-4 tracking-tight">Estoques</h1>
            <p class="text-lg">Gerenciamento de estoques</p>
        </div>
    </div>
    <div class="flex items-center justify-center p-8 text-slate-900">
        <div class="w-full max-w-sm">
            <div class="text-center mb-12 md:hidden">
                <mat-icon color="primary" style="transform: scale(2); height: 24px; width: 24px;" class="mb-4">storage</mat-icon>
                <h2 class="text-3xl font-bold tracking-tight">Estoques</h2>
            </div>
            <div class="mb-6">
                <h3 class="text-2xl font-semibold tracking-tight mb-1">Acessar</h3>
                <p class="text-sm text-slate-500">Insira suas credenciais para continuar</p>
            </div>
            <form [formGroup]="loginFormulario" (ngSubmit)="onSubmit()" class="flex flex-col gap-2">
                <mat-form-field appearance="outline" class="w-full">
                    <mat-icon matPrefix class="mr-2">person</mat-icon>
                    <mat-label>Usuário</mat-label>
                    <input #nmLogin matInput id="nmLogin" formControlName="nmLogin" placeholder="Digite seu usuário" [readonly]="carregando()">
                </mat-form-field>
                <mat-form-field appearance="outline" class="w-full">
                    <mat-icon matPrefix class="mr-2">lock</mat-icon>
                    <mat-label>Senha</mat-label>
                    <input matInput id="cdSenha" type="password" formControlName="cdSenha" placeholder="Digite sua senha" [readonly]="carregando()">
                </mat-form-field>
                <div class="mb-4 text-sm text-slate-500">
                    <a routerLink="/usuario/cadastro">Não possui cadastro? Clique aqui para cadastrar-se</a>
                </div>
                <button mat-raised-button color="primary" type="submit" [disabled]="loginFormulario.invalid || carregando()" class="w-full py-6 text-base font-semibold mt-2 relative">
                    @if (!carregando()) {
                        <span>Entrar</span>
                    }
                    @if (carregando()) {
                        <span>Autenticando...</span>
                    }
                </button>
            </form>
        </div>
    </div>
</div>
